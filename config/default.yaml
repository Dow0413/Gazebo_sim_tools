# all: execute both stages; glb_to_world / to_pcd: execute one stage only.
mode: all

paths:
  maps_dir: maps
  pcd_dir: pcd

# Stage 1: GLB -> self-contained Gazebo world folder in maps/<map_name>/.
glb_to_world:
  input_glb: glb/2026_9_22.glb
  map_name: test1
  overwrite: false

# Stage 2: world or mesh -> PCD.
to_pcd:
  input_type: mesh            # mesh | world
  # Empty -> reuse glb_to_world.input_glb (convenient for mode: all).
  input_file: ""
  output_file: test1.pcd
  resolution: 0.05
  voxel_size: 0.05
  # Applies only to mesh input: glTF Y-up -> Gazebo Z-up and lowest point -> z=0.
  gazebo_coordinates: true
